<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Orbit Glass</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #090a0d; color: #f2efe8; font-family: "Segoe UI", sans-serif; }
      body { overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      button { position: fixed; right: 12px; bottom: 12px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: #e2a45c; color: #1b140c; font: 600 16px/1 "Segoe UI", sans-serif; cursor: pointer; }
      p { position: fixed; left: 16px; top: 16px; margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="Drag to turn the glass object"></canvas>
    <p id="hint">Drag to turn</p>
    <button id="go" type="button">Continue</button>
    <script>
      function cta(url) {
        try {
          if (window.mraid && typeof mraid.open === 'function') return void mraid.open(url);
          if (window.FbPlayableAd && typeof FbPlayableAd.onCTAClick === 'function') return void FbPlayableAd.onCTAClick();
          if (window.ExitApi && typeof ExitApi.exit === 'function') ExitApi.exit();
        } catch (error) {}
      }
      const canvas = document.getElementById('c');
      const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
      if (!gl) document.getElementById('hint').textContent = 'WebGL is not available';
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let dragX = 0, dragY = 0, down = false, px = 0, py = 0, start = performance.now();
      if (gl) {
        const vs = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}';
        const fs = [
          'precision highp float;',
          'uniform vec2 uRes;uniform float uTime;uniform vec2 uDrag;',
          'float map(vec3 p){',
          '  float c=cos(uTime*0.25+uDrag.x), s=sin(uTime*0.25+uDrag.x);',
          '  p.xz=mat2(c,s,-s,c)*p.xz;',
          '  float ax=0.5+uDrag.y, ca=cos(ax), sa=sin(ax);',
          '  p.yz=mat2(ca,sa,-sa,ca)*p.yz;',
          '  return length(p)-1.05+sin(p.x*5.0+uTime)*sin(p.y*5.0)*sin(p.z*5.0)*0.045;',
          '}',
          'void main(){',
          '  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;',
          '  vec3 ro=vec3(0.0,0.0,3.1), rd=normalize(vec3(uv,-1.45));',
          '  float t=0.0; bool hit=false;',
          '  for(int i=0;i<48;i++){float d=map(ro+rd*t); if(d<0.002){hit=true;break;} t+=d; if(t>6.0)break;}',
          '  vec3 col=mix(vec3(0.05,0.05,0.07), vec3(0.12,0.1,0.08), uv.y+0.5);',
          '  if(hit){',
          '    vec3 p=ro+rd*t; vec2 e=vec2(0.002,0.0);',
          '    vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx)));',
          '    float fres=pow(1.0-max(dot(n,-rd),0.0),2.2);',
          '    float lambert=max(dot(n,normalize(vec3(0.4,0.8,0.3))),0.0);',
          '    col=mix(vec3(0.18,0.28,0.32), vec3(0.89,0.64,0.36), lambert);',
          '    col=mix(col, vec3(0.96,0.9,0.8), fres*0.7);',
          '  }',
          '  gl_FragColor=vec4(col,1.0);',
          '}',
        ].join('');
        function shader(type, source) {
          const item = gl.createShader(type);
          gl.shaderSource(item, source);
          gl.compileShader(item);
          return item;
        }
        const program = gl.createProgram();
        gl.attachShader(program, shader(gl.VERTEX_SHADER, vs));
        gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(program);
        gl.useProgram(program);
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(program, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        const uRes = gl.getUniformLocation(program, 'uRes');
        const uTime = gl.getUniformLocation(program, 'uTime');
        const uDrag = gl.getUniformLocation(program, 'uDrag');
        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr));
          canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
        function frame(now) {
          requestAnimationFrame(frame);
          const time = reduce ? 0 : (now - start) / 1000;
          gl.uniform2f(uRes, canvas.width, canvas.height);
          gl.uniform1f(uTime, time);
          gl.uniform2f(uDrag, dragX, dragY);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        addEventListener('resize', resize);
        resize();
        requestAnimationFrame(frame);
      }
      canvas.addEventListener('pointerdown', (event) => { down = true; px = event.clientX; py = event.clientY; });
      addEventListener('pointerup', () => { down = false; });
      addEventListener('pointermove', (event) => {
        if (!down) return;
        dragX += (event.clientX - px) * 0.008;
        dragY += (event.clientY - py) * 0.008;
        px = event.clientX; py = event.clientY;
      });
      document.getElementById('go').onclick = () => cta('https://thesurok.github.io/portfolio/');
    </script>
  </body>
</html>
