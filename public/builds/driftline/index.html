<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Driftline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #121318; color: #f2efe8; font-family: "Segoe UI", sans-serif; }
      body { overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      button { min-height: 44px; border-radius: 10px; border: 0; padding: 0 14px; font: inherit; cursor: pointer; }
      .primary { background: #e2a45c; color: #1b140c; font-weight: 600; }
      .ghost { background: transparent; color: #f2efe8; border: 1px solid rgba(255, 255, 255, 0.2); }
      #start { position: fixed; inset: 0; border: 0; background: rgba(0, 0, 0, 0.4); color: inherit; font-size: 1.1rem; font-weight: 600; }
      .bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none; gap: 8px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(20, 22, 28, 0.94); border: 1px solid rgba(255, 255, 255, 0.12); }
      .bar.show { display: flex; }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0" aria-label="Runner. Space or tap to jump."></canvas>
    <button id="start" type="button">Tap to run</button>
    <div class="bar" id="end">
      <span id="score"></span>
      <button class="ghost" id="retry" type="button">Retry</button>
      <button class="primary" id="go" type="button">Continue</button>
    </div>
    <script>
      function cta(url) {
        try {
          if (window.mraid && typeof mraid.open === 'function') return void mraid.open(url);
          if (window.FbPlayableAd && typeof FbPlayableAd.onCTAClick === 'function') return void FbPlayableAd.onCTAClick();
          if (window.ExitApi && typeof ExitApi.exit === 'function') ExitApi.exit();
        } catch (error) {}
      }
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let W = 1, H = 1, y = 0, vy = 0, speed = 280, dist = 0, alive = false, started = false, last = 0;
      let blocks = [];
      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = canvas.clientWidth; H = canvas.clientHeight;
        canvas.width = Math.max(1, Math.round(W * dpr));
        canvas.height = Math.max(1, Math.round(H * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function reset() {
        y = 0; vy = 0; speed = 280; dist = 0; alive = true; last = 0;
        blocks = [0, 1, 2, 3].map((i) => ({ x: W * 0.7 + i * 280, w: 26, h: 40 + (i % 3) * 18 }));
        document.getElementById('end').classList.remove('show');
      }
      function jump() {
        if (!started) return;
        if (!alive) return;
        if (y === 0) vy = -620;
      }
      function fail() {
        alive = false;
        document.getElementById('score').textContent = Math.floor(dist / 10) + ' m';
        document.getElementById('end').classList.add('show');
      }
      function loop(now) {
        requestAnimationFrame(loop);
        const dt = Math.min(0.033, last ? (now - last) / 1000 : 0.016);
        last = now;
        const ground = H * 0.78;
        if (started && alive) {
          vy += 1700 * dt; y += vy * dt;
          if (y > 0) { y = 0; vy = 0; }
          speed += 8 * dt; dist += speed * dt;
          for (const block of blocks) {
            block.x -= speed * dt;
            if (block.x < -80) { block.x = Math.max(...blocks.map((item) => item.x)) + 240 + Math.random() * 120; block.h = 34 + Math.random() * 46; }
            const px = W * 0.22, pw = 26, ph = 36;
            const top = ground + y - ph;
            const hit = px + 6 < block.x + block.w && px + pw - 6 > block.x && top + 6 < ground && top + ph - 4 > ground - block.h;
            if (hit) fail();
          }
        }
        ctx.fillStyle = '#121318'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#1c2430'; ctx.fillRect(0, ground - 80, W, 80);
        ctx.fillStyle = '#2a241c'; ctx.fillRect(0, ground, W, H - ground);
        ctx.fillStyle = '#e2a45c';
        const px = W * 0.22, ph = 36;
        ctx.fillRect(px, ground + y - ph, 26, ph);
        ctx.fillStyle = '#6cb6a6';
        for (const block of blocks) ctx.fillRect(block.x, ground - block.h, block.w, block.h);
        ctx.fillStyle = '#f2efe8'; ctx.font = '600 18px Segoe UI, sans-serif';
        ctx.fillText(started ? Math.floor(dist / 10) + ' m' : 'Driftline', 16, 32);
      }
      addEventListener('resize', resize); resize(); reset(); requestAnimationFrame(loop);
      document.getElementById('start').onclick = () => { started = true; document.getElementById('start').hidden = true; canvas.focus(); };
      canvas.addEventListener('pointerdown', jump);
      addEventListener('keydown', (event) => {
        if (event.key === ' ' || event.key === 'ArrowUp') { event.preventDefault(); jump(); }
      });
      document.getElementById('retry').onclick = () => reset();
      document.getElementById('go').onclick = () => cta('https://thesurok.github.io/portfolio/');
    </script>
  </body>
</html>
